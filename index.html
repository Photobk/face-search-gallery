<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบค้นหาภาพกิจกรรมด้วยใบหน้า | AI Face Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { 
      font-family: 'Prompt', sans-serif; 
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-modal {
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glow-bg {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 380px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, rgba(99, 102, 241, 0.1) 40%, transparent 70%);
      filter: blur(70px);
      z-index: -1;
      pointer-events: none;
    }
    .scan-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, transparent);
      animation: scan 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(120px); opacity: 0; }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-[#0b0f19] via-[#0f172a] to-[#020617] min-h-screen text-slate-100 flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Ambient Glow -->
  <div class="glow-bg"></div>

  <!-- Navbar -->
  <header class="w-full border-b border-slate-800 px-6 py-4 glass-card sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 border border-white/10">
          <i class="fa-solid fa-camera text-base text-white"></i>
        </div>
        <div>
          <h1 class="text-base md:text-lg font-bold tracking-tight text-white flex items-center gap-2">
            ระบบค้นหาภาพกิจกรรม
            <span class="text-[10px] bg-indigo-500/10 text-indigo-300 border border-indigo-400/20 px-2 py-0.5 rounded-full font-normal">AI Powered</span>
          </h1>
          <p class="text-xs text-slate-400">ค้นหารูปถ่ายของคุณทั้งหมดในกิจกรรมด้วยระบบสแกนใบหน้า</p>
        </div>
      </div>

      <button onclick="toggleModal(true)" class="group flex items-center gap-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-200 hover:text-white border border-indigo-500/30 px-3.5 py-2 rounded-xl text-xs font-medium transition duration-200 active:scale-95 shadow-sm">
        <i class="fa-solid fa-cloud-arrow-up text-indigo-400 group-hover:scale-110 transition-transform"></i>
        <span>ส่งรูปภาพเข้ากิจกรรม</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl w-full mx-auto p-4 md:p-8 flex-1 flex flex-col">
    
    <!-- Face Upload Area -->
    <section class="max-w-xl w-full mx-auto mb-10 text-center">
      <div class="glass-card rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden transition-all duration-300 border border-slate-800 hover:border-slate-700">
        
        <label for="search-input" class="cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-indigo-400/60 rounded-xl p-6 transition-all duration-300 hover:bg-slate-800/40 group relative">
          
          <!-- Image Preview / Icon Container -->
          <div id="preview-container" class="relative w-24 h-24 rounded-2xl overflow-hidden bg-slate-900/80 border border-slate-700 flex items-center justify-center mb-3 shadow-inner group-hover:scale-105 transition-transform">
            <i id="default-icon" class="fa-solid fa-user-viewfinder text-3xl text-slate-500 group-hover:text-indigo-400 transition-colors"></i>
            <img id="selfie-preview" class="w-full h-full object-cover hidden" alt="Selfie preview" />
            <div id="scan-bar" class="hidden absolute top-0 left-0 w-full scan-line"></div>
          </div>

          <div class="space-y-1">
            <span class="text-sm font-semibold text-slate-200 group-hover:text-indigo-300 transition-colors block">กดเลือกรูปหน้าตรง หรือ ถ่ายเซลฟี่</span>
            <span class="text-xs text-slate-400 block">รองรับไฟล์ JPG, PNG (แนะนำใบหน้าตรง ชัดเจน ไม่สวมแว่นตาดำ)</span>
          </div>

          <input id="search-input" type="file" accept="image/*" class="hidden" onchange="searchFace(event)">
        </label>

        <!-- Search Status Box -->
        <div id="search-status" class="hidden mt-4 pt-4 border-t border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-2.5 text-xs text-indigo-300">
            <i id="status-spinner" class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i>
            <span id="status-msg" class="font-normal text-slate-300">กำลังตรวจจับใบหน้าและค้นหา...</span>
          </div>
          <button onclick="resetSearch()" class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5 active:scale-95">
            <i class="fa-solid fa-rotate-left"></i> ล้างค่า
          </button>
        </div>

      </div>
    </section>

    <!-- Results Section -->
    <section class="flex-1 flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
        <div class="flex items-center gap-2.5">
          <i class="fa-solid fa-images text-indigo-400"></i>
          <h2 class="text-base font-semibold text-white">รูปภาพที่ค้นพบ</h2>
        </div>
        <span id="result-badge" class="text-xs bg-slate-800/80 border border-slate-700 text-slate-400 px-3 py-1 rounded-full">ยังไม่มีการค้นหา</span>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-center py-16 text-slate-500">
        <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-3">
          <i class="fa-regular fa-image text-2xl text-slate-600"></i>
        </div>
        <p class="text-sm">อัปโหลดรูปหน้าของคุณที่กล่องด้านบน เพื่อให้ระบบค้นหาภาพกิจกรรมที่มีคุณ</p>
      </div>

      <!-- Events Container (Group by Event) -->
      <div id="events-container" class="space-y-8">
        <!-- บล็อกกิจกรรมแต่ละรายการจะแสดงที่นี่ -->
      </div>
    </section>

  </main>

  <!-- Upload Modal -->
  <div id="upload-modal" class="hidden fixed inset-0 glass-modal flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl text-slate-100 relative">
      
      <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-indigo-500/10 border border-indigo-400/20 flex items-center justify-center text-indigo-400">
            <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
          </div>
          <h3 class="font-bold text-sm md:text-base text-white">ส่งภาพเข้าร่วมกิจกรรม</h3>
        </div>
        <button type="button" onclick="toggleModal(false)" class="text-slate-400 hover:text-white text-base">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form onsubmit="event.preventDefault(); uploadPhotos();" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-300 mb-1.5 font-medium">ชื่อกิจกรรม</label>
          <input type="text" id="ev-title" value="กิจกรรมสัมพันธ์" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-slate-300 mb-1.5 font-medium">วันที่จัดกิจกรรม</label>
          <input type="date" id="ev-date" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-slate-300 mb-1.5 font-medium">เลือกรูปภาพกิจกรรม (เลือกได้หลายรูป)</label>
          <input type="file" id="ev-files" accept="image/*" multiple required class="w-full file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600/20 file:text-indigo-300 hover:file:bg-indigo-600/30 text-slate-400 border border-slate-800 rounded-xl p-1.5 bg-slate-950 focus:outline-none">
        </div>

        <!-- Upload Status Message -->
        <div id="modal-msg" class="hidden p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 flex items-center gap-2">
          <i class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i>
          <span id="modal-msg-text">กำลังอัปโหลด...</span>
        </div>

        <div class="flex justify-end gap-2.5 pt-3">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition">ยกเลิก</button>
          <button type="submit" id="btn-upload" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/20 transition active:scale-95">ส่งรูปภาพ</button>
        </div>
      </form>

    </div>
  </div>

  <script>
    const HF_API = "https://face-search-api-h8vt.onrender.com";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyhK9fhU7MbN_-xEa3pHvzfZ-1IwEelzo9NUQ3L-zmgS14gpM2DkRzGvh2UvQSdWNQ/exec";
    const FOLDER_ID = "1LL0fqqxFG9-bAwaUMsaOL90of0ZOsvct";

    document.getElementById('ev-date').valueAsDate = new Date();

    function toggleModal(show) {
      document.getElementById('upload-modal').classList.toggle('hidden', !show);
    }

    // ฟังก์ชันค้นหาใบหน้า
    async function searchFace(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const preview = document.getElementById('selfie-preview');
        const defaultIcon = document.getElementById('default-icon');
        const scanBar = document.getElementById('scan-bar');
        
        preview.src = e.target.result;
        preview.classList.remove('hidden');
        defaultIcon.classList.add('hidden');
        scanBar.classList.remove('hidden');
      };
      reader.readAsDataURL(file);

      const statusBox = document.getElementById('search-status');
      const statusMsg = document.getElementById('status-msg');
      const spinner = document.getElementById('status-spinner');
      const container = document.getElementById('events-container');
      const emptyState = document.getElementById('empty-state');
      const badge = document.getElementById('result-badge');
      
      statusBox.classList.remove('hidden');
      statusMsg.innerText = "กำลังตรวจจับใบหน้าและค้นหาจากระบบ AI...";
      spinner.classList.remove('hidden');

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch(`${HF_API}/search`, { method: "POST", body: formData });
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        const data = await res.json();
        container.innerHTML = "";
        document.getElementById('scan-bar').classList.add('hidden');

        if (data.results && data.results.length > 0) {
          emptyState.classList.add('hidden');
          statusMsg.innerText = "ประมวลผลสำเร็จ";
          badge.innerText = `พบภาพที่ตรงกัน ${data.results.length} รูป`;
          badge.className = "text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-3 py-1 rounded-full font-medium";

          // จัดกลุ่มผลลัพธ์แยกตามชื่อกิจกรรม
          const groupedEvents = {};
          data.results.forEach(item => {
            const title = item.event_title || item.title || "รูปกิจกรรมทั่วไป";
            if (!groupedEvents[title]) {
              groupedEvents[title] = {
                title: title,
                date: item.event_date || item.date || "",
                photos: []
              };
            }
            groupedEvents[title].photos.push(item);
          });

          // สร้างการ์ดแสดงผลแยกแต่ละกิจกรรม
          Object.values(groupedEvents).forEach(eventGroup => {
            let photoCardsHtml = "";

            eventGroup.photos.forEach(item => {
              const imgUrl = item.photo_url || item.image_url || item.url || "";
              const scorePct = item.score ? (item.score * 100).toFixed(1) : null;

              photoCardsHtml += `
                <div class="group glass-card rounded-xl overflow-hidden shadow-xl hover:shadow-indigo-500/10 border border-slate-800 hover:border-slate-700 transition-all duration-300 flex flex-col justify-between">
                  <div class="relative overflow-hidden aspect-[4/3] bg-slate-950">
                    <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/300?text=Error'">
                    ${scorePct ? `
                      <div class="absolute top-2.5 right-2.5 bg-slate-950/80 backdrop-blur-md border border-emerald-500/40 text-emerald-400 text-[11px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 shadow">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        ${scorePct}%
                      </div>
                    ` : ''}
                  </div>
                  <div class="p-3 flex justify-end items-center border-t border-slate-800/80 bg-slate-900/40">
                    <a href="${imgUrl}" target="_blank" class="text-[11px] bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition">
                      <i class="fa-solid fa-up-right-from-square text-[10px]"></i> เปิดภาพเต็ม
                    </a>
                  </div>
                </div>
              `;
            });

            container.innerHTML += `
              <div class="space-y-3">
                <div class="flex items-center justify-between bg-slate-900/60 border border-slate-800 px-4 py-3 rounded-xl">
                  <div class="flex items-center gap-2.5">
                    <div class="w-2 h-2 rounded-full bg-indigo-500"></div>
                    <h3 class="font-semibold text-sm md:text-base text-slate-200">${eventGroup.title}</h3>
                    ${eventGroup.date ? `<span class="text-xs text-slate-400 font-normal flex items-center gap-1"><i class="fa-regular fa-calendar-days text-[10px]"></i> ${eventGroup.date}</span>` : ''}
                  </div>
                  <span class="text-xs bg-slate-800 text-slate-300 border border-slate-700 px-2.5 py-0.5 rounded-full">
                    ${eventGroup.photos.length} รูป
                  </span>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5 md:gap-4">
                  ${photoCardsHtml}
                </div>
              </div>
            `;
          });

        } else {
          emptyState.classList.remove('hidden');
          emptyState.querySelector('p').innerText = "ไม่พบรูปภาพของคุณในกิจกรรมนี้ (คะแนนความคล้ายคลึงไม่ถึงเกณฑ์)";
          badge.innerText = `พบ 0 รูป`;
          badge.className = "text-xs bg-rose-500/10 border border-rose-500/30 text-rose-400 px-3 py-1 rounded-full font-medium";
          statusMsg.innerText = "การค้นหาเสร็จสิ้น แต่ไม่พบบุคคลที่ตรงกัน";
        }
      } catch (err) {
        console.error("Search Error:", err);
        document.getElementById('scan-bar').classList.add('hidden');
        statusMsg.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์";
        badge.innerText = "เกิดข้อผิดพลาด";
      } finally {
        spinner.classList.add('hidden');
      }
    }

    function resetSearch() {
      document.getElementById('search-input').value = "";
      document.getElementById('search-status').classList.add('hidden');
      document.getElementById('events-container').innerHTML = "";
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('empty-state').querySelector('p').innerText = "อัปโหลดรูปหน้าของคุณที่กล่องด้านบน เพื่อให้ระบบค้นหาภาพกิจกรรมที่มีคุณ";
      document.getElementById('result-badge').innerText = "ยังไม่มีการค้นหา";
      document.getElementById('result-badge').className = "text-xs bg-slate-800/80 border border-slate-700 text-slate-400 px-3 py-1 rounded-full";
      
      document.getElementById('selfie-preview').classList.add('hidden');
      document.getElementById('default-icon').classList.remove('hidden');
      document.getElementById('scan-bar').classList.add('hidden');
    }

    function resizeImage(file, maxWidth = 1200) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadPhotos() {
      const files = document.getElementById('ev-files').files;
      const title = document.getElementById('ev-title').value;
      const date = document.getElementById('ev-date').value;
      const msg = document.getElementById('modal-msg');
      const msgText = document.getElementById('modal-msg-text');
      const btn = document.getElementById('btn-upload');

      if (files.length === 0) return alert("กรุณาเลือกรูปภาพอย่างน้อย 1 รูป");

      msg.classList.remove('hidden');
      btn.disabled = true;

      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          msgText.innerText = `กำลังประมวลผลและส่งรูปที่ ${i + 1}/${files.length}...`;

          const base64Data = await resizeImage(file, 1200);

          const payload = {
            folderId: FOLDER_ID,
            fileName: file.name,
            mimeType: "image/jpeg",
            base64Data: base64Data,
            eventTitle: title,
            eventDate: date
          };

          await fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(payload)
          });
        }

        alert("ส่งรูปภาพเข้าสู่ระบบเรียบร้อยแล้ว! ระบบ AI กำลังประมวลผลใบหน้าในพื้นหลัง");
        toggleModal(false);
        document.getElementById('ev-files').value = "";
      } catch (err) {
        console.error("Upload Error:", err);
        alert("เกิดข้อผิดพลาดในการอัปโหลดรูปภาพ: " + err.message);
      } finally {
        msg.classList.add('hidden');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
